{% extends 'base.html' %}
{% block title %}Verify ZK Proof - MediChain{% endblock %}
{% block breadcrumb_items %}
<li class="breadcrumb-item"><a href="{% url 'zk_dashboard' %}" style="color: var(--accent);">ZK Proofs</a></li>
<li class="breadcrumb-item active">Verify</li>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header"><i class="bi bi-shield-check"></i> Verify Zero-Knowledge Proof</div>
            <div class="card-body p-4">
                <form method="post" action="{% url 'zk_verify_page' %}">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Proof JSON *</label>
                        <textarea name="proof" class="form-control" rows="5" placeholder="Paste the ZK proof JSON here..." required></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Public Output (Merkle Root) *</label>
                        <input type="text" name="public_output" class="form-control" placeholder="Expected Merkle root" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Expected Inputs</label>
                        <textarea name="expected_inputs" class="form-control" rows="2" placeholder="Transaction hashes (optional)"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Proof Type</label>
                        <select name="proof_type" class="form-select">
                            <option value="zk_snark">zk-SNARK</option>
                            <option value="zk_stark">zk-STARK</option>
                        </select>
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'zk_dashboard' %}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Back</a>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-shield-check"></i> Verify Proof</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
