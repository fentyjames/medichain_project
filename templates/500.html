{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 – Server Error | MediChain</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{% static 'custom_css.css' %}">
</head>
<body class="dark-theme d-flex align-items-center justify-content-center" style="min-height:100vh;">
    <div class="text-center px-4">
        <i class="bi bi-exclamation-octagon" style="font-size:5rem;color:#f87171;"></i>
        <h1 class="display-1 fw-bold mt-3" style="color:#f87171;">500</h1>
        <h4 class="mb-3">Internal Server Error</h4>
        <p class="text-muted mb-4">
            Something went wrong on our end. The error has been logged.<br>
            Please try again in a moment.
        </p>
        <div class="d-flex gap-3 justify-content-center">
            <a href="/" class="btn btn-primary px-4">
                <i class="bi bi-house"></i> Go Home
            </a>
            <a href="javascript:history.back()" class="btn btn-outline-secondary px-4">
                <i class="bi bi-arrow-left"></i> Go Back
            </a>
        </div>
        <p class="text-muted mt-5" style="font-size:0.8rem;">
            MediChain &nbsp;&middot;&nbsp; If this persists, contact your system administrator.
        </p>
    </div>
</body>
</html>
