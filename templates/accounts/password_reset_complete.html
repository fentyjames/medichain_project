{% extends 'base.html' %}
{% block title %}Password Changed - MediChain{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: calc(100vh - 200px);">
  <div class="col-md-5 col-lg-4">
    <div class="card" style="border: 1px solid var(--border); background: var(--bg-card); backdrop-filter: var(--blur);">
      <div class="card-body p-4 text-center">
        <div class="mb-4">
          <i class="bi bi-check-circle" style="font-size: 2.5rem; color: var(--success);"></i>
          <h4 class="mt-2" style="color: var(--text-primary); font-weight: 600;">Password Updated!</h4>
        </div>
        <p style="color: var(--text-muted); font-size: 0.9rem;">
          Your password has been changed successfully. You can now sign in with your new password.
        </p>
        <a href="{% url 'accounts:login' %}" class="btn btn-primary mt-3" style="background: var(--accent); border: none; border-radius: var(--radius-sm); font-weight: 500;">
          <i class="bi bi-box-arrow-in-right me-2"></i>Sign In Now
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
