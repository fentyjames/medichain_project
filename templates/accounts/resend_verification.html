{% extends 'base.html' %}
{% block title %}Resend Verification - MediChain{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: calc(100vh - 200px);">
  <div class="col-md-5 col-lg-4">
    <div class="card" style="border: 1px solid var(--border); background: var(--bg-card); backdrop-filter: var(--blur);">
      <div class="card-body p-4 text-center">
        <div class="mb-4">
          <i class="bi bi-envelope-plus" style="font-size: 2.5rem; color: var(--accent);"></i>
          <h4 class="mt-2" style="color: var(--text-primary); font-weight: 600;">Resend Verification</h4>
        </div>
        <p class="mb-4" style="color: var(--text-muted); font-size: 0.9rem;">Enter your email to receive a new verification link.</p>

        <form method="post">
          {% csrf_token %}
          <div class="mb-3 text-start">
            <label class="form-label" style="color: var(--text-light); font-size: 0.85rem; font-weight: 500;">Email</label>
            <input type="email" name="email" class="form-control" placeholder="Your registered email" required autocomplete="email">
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2" style="background: var(--accent); border: none; border-radius: var(--radius-sm); font-weight: 500;">
            <i class="bi bi-send me-2"></i>Send Verification
          </button>
        </form>

        <p class="mt-4 mb-0" style="color: var(--text-muted); font-size: 0.9rem;">
          <a href="{% url 'accounts:login' %}" style="color: var(--accent); text-decoration: none;">Back to Sign In</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
