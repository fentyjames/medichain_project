{% extends 'base.html' %}
{% block title %}Two-Factor Authentication - MediChain{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <div>
    <h1 style="color: var(--accent);"><i class="bi bi-shield-lock"></i> Two-Factor Authentication</h1>
    <p style="color: var(--text-muted);">Secure your account with an extra layer of protection</p>
  </div>
</div>

<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card" style="border: 1px solid var(--border); background: var(--bg-card); backdrop-filter: var(--blur);">
      <div class="card-header" style="background: rgba(56,189,248,0.1); border-bottom: 1px solid var(--border); color: var(--accent); font-weight: 600;">
        <i class="bi bi-shield-lock me-2"></i>2FA Setup
      </div>
      <div class="card-body p-4">
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label" style="color: var(--text-light); font-size: 0.85rem; font-weight: 500;">{{ form.enable_2fa.label }}</label>
            {{ form.enable_2fa }}
          </div>
          <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary" style="background: var(--accent); border: none; border-radius: var(--radius-sm); font-weight: 500;">
              <i class="bi bi-check-lg me-2"></i>Save Changes
            </button>
            <a href="{% url 'accounts:profile' %}" class="btn btn-outline-primary" style="border-color: var(--accent); color: var(--accent); border-radius: var(--radius-sm);">
              <i class="bi bi-x-lg me-2"></i>Cancel
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
