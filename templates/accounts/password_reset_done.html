{% extends 'base.html' %}
{% block title %}Email Sent - MediChain{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: calc(100vh - 200px);">
  <div class="col-md-5 col-lg-4">
    <div class="card" style="border: 1px solid var(--border); background: var(--bg-card); backdrop-filter: var(--blur);">
      <div class="card-body p-4 text-center">
        <div class="mb-4">
          <i class="bi bi-envelope-check" style="font-size: 2.5rem; color: var(--success);"></i>
          <h4 class="mt-2" style="color: var(--text-primary); font-weight: 600;">Check Your Email</h4>
        </div>
        <p style="color: var(--text-muted); font-size: 0.9rem;">
          We've sent a password reset link to your email address. Please check your inbox and follow the instructions.
        </p>
        <a href="{% url 'accounts:login' %}" class="btn btn-outline-primary mt-3" style="border-color: var(--accent); color: var(--accent); border-radius: var(--radius-sm);">
          <i class="bi bi-box-arrow-in-left me-2"></i>Back to Sign In
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
