{% extends 'base.html' %}
{% block title %}Add Insurance Provider - MediChain{% endblock %}

{% block content %}
<nav aria-label="breadcrumb" class="mb-4">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="{% url 'insurance_list' %}">Insurance Providers</a></li>
        <li class="breadcrumb-item active">Add Provider</li>
    </ol>
</nav>

<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="card">
            <div class="card-header"><i class="bi bi-shield-plus"></i> Register Insurance Provider</div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label">Provider Name <span class="text-danger">*</span></label>
                            <input type="text" name="name" class="form-control" required
                                   placeholder="e.g. National Health Insurance">
                        </div>
                        <div class="col-12">
                            <label class="form-label">License Number</label>
                            <input type="text" name="license_number" class="form-control"
                                   placeholder="e.g. INS-SL-2024-001">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Public Key <small class="text-muted">(optional)</small></label>
                            <textarea name="public_key" class="form-control" rows="2"
                                      placeholder="Provider's public key for cryptographic verification…"></textarea>
                        </div>
                    </div>
                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-primary flex-grow-1">
                            <i class="bi bi-plus-lg"></i> Register Provider
                        </button>
                        <a href="{% url 'insurance_list' %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
