{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 – Page Not Found | MediChain</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{% static 'custom_css.css' %}">
</head>
<body class="dark-theme d-flex align-items-center justify-content-center" style="min-height:100vh;">
    <div class="text-center px-4">
        <i class="bi bi-file-earmark-x" style="font-size:5rem;color:var(--accent);"></i>
        <h1 class="display-1 fw-bold mt-3" style="color:var(--accent);">404</h1>
        <h4 class="mb-3">Page Not Found</h4>
        <p class="text-muted mb-4">
            The page you requested doesn't exist or has been moved.<br>
            {% if request_path %}<code class="hash-text">{{ request_path }}</code>{% endif %}
        </p>
        <div class="d-flex gap-3 justify-content-center">
            <a href="/" class="btn btn-primary px-4">
                <i class="bi bi-house"></i> Go Home
            </a>
            <a href="javascript:history.back()" class="btn btn-outline-secondary px-4">
                <i class="bi bi-arrow-left"></i> Go Back
            </a>
        </div>
        <p class="text-muted mt-5" style="font-size:0.8rem;">
            MediChain &nbsp;&middot;&nbsp; If you believe this is an error, contact your administrator.
        </p>
    </div>
</body>
</html>
