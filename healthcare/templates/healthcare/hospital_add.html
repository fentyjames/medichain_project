{% extends 'base.html' %}
{% block title %}Add Hospital - MediChain{% endblock %}
{% block breadcrumb_items %}
<li class="breadcrumb-item"><a href="{% url 'healthcare_dashboard' %}" style="color: var(--accent);">Healthcare</a></li>
<li class="breadcrumb-item"><a href="{% url 'hospital_list' %}" style="color: var(--accent);">Hospitals</a></li>
<li class="breadcrumb-item active">Add Hospital</li>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header"><i class="bi bi-building-add"></i> Register New Hospital</div>
            <div class="card-body p-4">
                <form method="post" action="{% url 'hospital_add' %}">
                    {% csrf_token %}
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Hospital Name *</label>
                            <input type="text" name="name" class="form-control" placeholder="e.g., Ankara University Hospital" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">License Number *</label>
                            <input type="text" name="license_number" class="form-control" placeholder="e.g., LIC-2025-001" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Address</label>
                        <textarea name="address" class="form-control" rows="2" placeholder="Full hospital address..."></textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Public Key *</label>
                            <input type="text" name="public_key" class="form-control" placeholder="Hospital's cryptographic public key" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Blockchain Network</label>
                            <select name="blockchain_network" class="form-select">
                                <option value="">Select Network (Optional)</option>
                                {% for network in networks %}
                                <option value="{{ network.id }}">{{ network.name }} (Chain ID: {{ network.chain_id }})</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'hospital_list' %}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Back</a>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Register Hospital</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
