{% extends 'base.html' %}
{% block title %}Grant Access - MediChain{% endblock %}
{% block breadcrumb_items %}
<li class="breadcrumb-item"><a href="{% url 'healthcare_dashboard' %}" style="color: var(--accent);">Healthcare</a></li>
<li class="breadcrumb-item active">Grant Access</li>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header"><i class="bi bi-key"></i> Grant Access Permission</div>
            <div class="card-body p-4">
                <form method="post" action="{% url 'permission_add' %}">
                    {% csrf_token %}
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Record *</label>
                            <select name="record_id" class="form-select" required>
                                <option value="">Select Record</option>
                                {% for record in records %}
                                <option value="{{ record.record_id }}" {% if selected_record == record.record_id %}selected{% endif %}>
                                    {{ record.title|truncatechars:30 }} ({{ record.patient.patient_id|truncatechars:8 }})
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Patient (Grantor) *</label>
                            <select name="patient_id" class="form-select" required>
                                <option value="">Select Patient</option>
                                {% for patient in patients %}
                                <option value="{{ patient.patient_id }}" {% if selected_patient == patient.patient_id %}selected{% endif %}>
                                    {{ patient.patient_id|truncatechars:12 }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Grantee ID *</label>
                            <input type="text" name="grantee" class="form-control" placeholder="Hospital/Lab/Doctor ID" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Grantee Type *</label>
                            <select name="grantee_type" class="form-select" required>
                                <option value="HOSPITAL">Hospital</option>
                                <option value="LAB">Laboratory</option>
                                <option value="INSURANCE">Insurance Provider</option>
                                <option value="DOCTOR">Doctor</option>
                            </select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Permission Type *</label>
                            <select name="permission_type" class="form-select" required>
                                <option value="READ">Read Only</option>
                                <option value="WRITE">Read and Write</option>
                                <option value="SHARE">Share with Others</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Valid Until</label>
                            <input type="datetime-local" name="valid_until" class="form-control">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Purpose *</label>
                        <textarea name="purpose" class="form-control" rows="2" placeholder="e.g., Emergency treatment, Second opinion..." required></textarea>
                        <div class="form-text" style="color: var(--text-light);">Required for HIPAA compliance</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Patient Digital Signature *</label>
                        <input type="text" name="signature" class="form-control" placeholder="ECDSA signature authorizing this access" required>
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'healthcare_dashboard' %}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Back</a>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Grant Access</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
